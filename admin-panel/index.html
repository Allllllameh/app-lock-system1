<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AppLock | مدیریت هوشمند</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root {
            --bg-color: #0b1120; --surface-color: #1e293b; --surface-light: #334155;
            --primary-color: #6366f1; --primary-dark: #4f46e5; --danger-color: #ef4444;
            --success-color: #10b981; --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .flex { display: flex; } .flex-col { flex-direction: column; } .items-center { align-items: center; }
        .justify-between { justify-content: space-between; } .justify-center { justify-content: center; }
        .w-full { width: 100%; } .h-full { height: 100%; } .flex-1 { flex: 1; }
        .relative { position: relative; } .absolute { position: absolute; } .fixed { position: fixed; } .inset-0 { top: 0; left: 0; right: 0; bottom: 0; }
        .z-10 { z-index: 10; } .z-50 { z-index: 50; } .text-center { text-align: center; } .hidden { display: none !important; }
        .app-header { padding: 24px 20px 16px 20px; background-color: rgba(11, 17, 32, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 30; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .header-title { font-size: 20px; font-weight: 900; } .header-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .avatar { width: 44px; height: 44px; background-color: var(--surface-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); color: var(--primary-color); font-size: 18px; }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .card { background-color: var(--surface-color); border-radius: 24px; padding: 20px; border: 1px solid var(--border-color); margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .stat-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 18px; }
        .stat-number { font-size: 28px; font-weight: 900; margin-bottom: 4px; } .stat-label { font-size: 12px; color: var(--text-muted); }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background-color: var(--surface-color); border-radius: 20px; border: 1px solid var(--border-color); margin-bottom: 12px; cursor: pointer; transition: transform 0.1s; }
        .list-item:active { transform: scale(0.98); }
        .list-item-icon { width: 48px; height: 48px; background-color: var(--surface-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin-left: 12px; }
        .switch { position: relative; display: inline-block; width: 52px; height: 32px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--surface-light); transition: .4s; border-radius: 32px; border: 2px solid var(--surface-light); }
        .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 2px; bottom: 2px; background-color: var(--text-muted); transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--danger-color); border-color: var(--danger-color); }
        input:checked + .slider:before { transform: translateX(-20px); background-color: white; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background-color: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px 10px; border-top: 1px solid var(--border-color); z-index: 40; padding-bottom: env(safe-area-inset-bottom, 12px); }
        .nav-btn { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: bold; cursor: pointer; width: 60px; transition: color 0.2s; }
        .nav-btn i { font-size: 20px; } .nav-btn.active { color: var(--primary-color); }
        .input-group { background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: 16px; display: flex; align-items: center; padding: 0 16px; margin-bottom: 16px; height: 56px; transition: border-color 0.2s; }
        .input-group:focus-within { border-color: var(--primary-color); }
        .input-group i { color: var(--text-muted); margin-left: 12px; font-size: 18px; }
        .input-group input, .input-group select { background: transparent; border: none; outline: none; color: white; width: 100%; height: 100%; font-size: 14px; font-family: 'Vazirmatn'; }
        .btn-primary { width: 100%; background-color: var(--primary-color); color: white; border: none; border-radius: 16px; height: 56px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary:active { background-color: var(--primary-dark); transform: scale(0.98); }
        .duration-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .duration-btn { background-color: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 12px; padding: 12px 0; font-weight: bold; font-family: 'Vazirmatn'; cursor: pointer; }
        .duration-btn.active { background-color: rgba(99, 102, 241, 0.2); border-color: var(--primary-color); color: var(--primary-color); }
        .bottom-sheet-overlay { position: fixed; inset: 0; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 50; }
        .bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; height: 88%; background-color: var(--bg-color); border-top-left-radius: 32px; border-top-right-radius: 32px; z-index: 60; display: flex; flex-direction: column; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; border-top: 1px solid var(--border-color); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .sheet-handle { width: 48px; height: 6px; background-color: var(--surface-light); border-radius: 10px; margin: 12px auto; cursor: pointer; }
        .sheet-tabs { display: flex; border-bottom: 1px solid var(--border-color); padding: 0 20px; }
        .sheet-tab { flex: 1; padding: 16px 0; background: transparent; border: none; color: var(--text-muted); font-family: 'Vazirmatn'; font-weight: bold; border-bottom: 2px solid transparent; cursor: pointer; }
        .sheet-tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .login-screen { position: fixed; inset: 0; background-color: var(--bg-color); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
        .edit-btn { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-muted); width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-right: 8px; transition: 0.2s; }
        .edit-btn:active { color: var(--primary-color); border-color: var(--primary-color); }
    </style>
</head>
<body>
    <div x-data="adminApp()" x-init="init()" class="w-full h-full flex flex-col relative">
        <div x-show="!isLoggedIn" x-cloak class="login-screen">
            <div style="width: 96px; height: 96px; background: rgba(99,102,241,0.1); border-radius: 32px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; border: 1px solid rgba(99,102,241,0.2);">
                <i class="fa-solid fa-shield-halved" style="font-size: 48px; color: var(--primary-color);"></i>
            </div>
            <h1 style="font-size: 28px; font-weight: 900; margin-bottom: 8px;">AppLock</h1>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 40px;">پنل مدیریت هوشمند</p>
            <div style="width: 100%; max-width: 360px;">
                <div class="input-group">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" x-model="loginEmail" dir="ltr" placeholder="admin@company.com">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" x-model="loginPassword" dir="ltr" placeholder="••••••••">
                </div>
                <button @click="login()" class="btn-primary" style="margin-top: 8px;">ورود به پنل</button>
            </div>
        </div>

        <div x-show="isLoggedIn" x-cloak class="flex flex-col h-full w-full">
            <header class="app-header">
                <div>
                    <h1 class="header-title" x-text="pageTitle"></h1>
                    <p class="header-subtitle" x-text="pageSubtitle"></p>
                </div>
                <div class="avatar"><i class="fa-solid fa-user-tie"></i></div>
            </header>

            <main class="main-content">
                <div x-show="activeTab === 'home'" x-transition.opacity>
                    <div class="grid-2">
                        <div class="card">
                            <div class="stat-icon" style="background: rgba(99,102,241,0.1); color: var(--primary-color);"><i class="fa-solid fa-users"></i></div>
                            <h3 class="stat-number" x-text="employees.length"></h3>
                            <p class="stat-label">کل کاربران</p>
                        </div>
                        <div class="card">
                            <div class="stat-icon" style="background: rgba(239,68,68,0.1); color: var(--danger-color);"><i class="fa-solid fa-lock"></i></div>
                            <h3 class="stat-number" x-text="totalLockedApps"></h3>
                            <p class="stat-label">اپ قفل شده</p>
                        </div>
                    </div>
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                            <h3 style="font-size: 14px; font-weight: bold;">نمودار استفاده هفتگی</h3>
                        </div>
                        <div style="height: 160px; width: 100%;"><canvas id="usageChart"></canvas></div>
                    </div>
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                            <h3 style="font-size: 14px; font-weight: bold;">آخرین لاگ‌های مصرف</h3>
                            <button @click="loadData()" style="background: var(--surface-light); border: none; width: 32px; height: 32px; border-radius: 50%; color: white; cursor: pointer;"><i class="fa-solid fa-rotate-right" style="font-size: 12px;"></i></button>
                        </div>
                        <template x-if="recentLogs.length === 0">
                            <div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px 0;">هیچ لاگی ثبت نشده است.</div>
                        </template>
                        <template x-for="log in recentLogs" :key="log.id">
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color);">
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <div style="width: 36px; height: 36px; background: var(--surface-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: var(--primary-color);" x-text="log.profiles?.full_name?.charAt(0) || 'U'"></div>
                                    <div>
                                        <p style="font-size: 14px; font-weight: bold;" x-text="log.profiles?.full_name || 'کاربر'"></p>
                                        <p style="font-size: 10px; color: var(--text-muted);" x-text="log.app_name || 'دسترسی'"></p>
                                    </div>
                                </div>
                                <span style="font-size: 12px; font-weight: bold; color: var(--success-color); background: rgba(16,185,129,0.1); padding: 4px 8px; border-radius: 8px;" dir="ltr" x-text="'+' + Math.floor((log.seconds_used || 0) / 60) + ' min'"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <div x-show="activeTab === 'users'" x-transition.opacity>
                    <div class="input-group" style="margin-bottom: 16px;">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" x-model="searchQuery" placeholder="جستجوی کاربر...">
                    </div>
                    <template x-for="emp in filteredEmployees" :key="emp.id">
                        <div class="list-item">
                            <div @click="openUserModal(emp)" style="display: flex; align-items: center; flex: 1;">
                                <div class="list-item-icon" x-text="emp.full_name?.charAt(0) || 'U'"></div>
                                <div>
                                    <h4 style="font-size: 14px; font-weight: bold;" x-text="emp.full_name || 'بدون نام'"></h4>
                                    <p style="font-size: 11px; color: var(--text-muted); margin-top: 4px;" x-text="emp.devices?.[0]?.device_name || 'آفلاین'"></p>
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <button @click.stop="editName(emp)" class="edit-btn"><i class="fa-solid fa-pen" style="font-size: 12px;"></i></button>
                                <div style="background: var(--bg-color); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; gap: 6px; align-items: center;">
                                    <i class="fa-solid fa-lock" style="font-size: 10px; color: var(--danger-color);"></i>
                                    <span style="font-size: 12px; font-weight: bold;" x-text="emp.policies?.[0]?.app_packages?.length || 0"></span>
                                </div>
                                <i @click="openUserModal(emp)" class="fa-solid fa-chevron-left" style="color: var(--text-muted); font-size: 12px; cursor: pointer; padding: 8px;"></i>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="activeTab === 'codes'" x-transition.opacity>
                    <div class="card">
                        <div style="display: flex; background: var(--bg-color); padding: 4px; border-radius: 16px; margin-bottom: 24px; border: 1px solid var(--border-color);">
                            <button @click="codeType = 'public'" :style="codeType === 'public' ? 'background: var(--surface-light); color: white;' : 'color: var(--text-muted);'" style="flex: 1; padding: 10px; border-radius: 12px; border: none; font-family: Vazirmatn; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s;">رمز عمومی</button>
                            <button @click="codeType = 'private'" :style="codeType === 'private' ? 'background: var(--surface-light); color: white;' : 'color: var(--text-muted);'" style="flex: 1; padding: 10px; border-radius: 12px; border: none; font-family: Vazirmatn; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s;">رمز خصوصی</button>
                        </div>
                        <div x-show="codeType === 'private'" style="margin-bottom: 20px;">
                            <label style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px; display: block;">انتخاب کاربر</label>
                            <select x-model="selectedUserId" style="width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 12px; outline: none; font-family: Vazirmatn;">
                                <option value="">-- انتخاب کنید --</option>
                                <template x-for="emp in employees" :key="emp.id">
                                    <option :value="emp.id" x-text="emp.full_name"></option>
                                </template>
                            </select>
                        </div>
                        <label style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px; display: block;">مدت زمان (دقیقه)</label>
                        <div class="duration-grid">
                            <button @click="duration = 15" :class="duration === 15 ? 'active' : ''" class="duration-btn">۱۵</button>
                            <button @click="duration = 30" :class="duration === 30 ? 'active' : ''" class="duration-btn">۳۰</button>
                            <button @click="duration = 60" :class="duration === 60 ? 'active' : ''" class="duration-btn">۶۰</button>
                            <button @click="duration = 120" :class="duration === 120 ? 'active' : ''" class="duration-btn">۱۲۰</button>
                        </div>
                        <button @click="generateCode()" class="btn-primary"><i class="fa-solid fa-bolt"></i> تولید و ثبت رمز</button>
                    </div>
                    <div class="card">
                        <h3 style="font-size: 14px; font-weight: bold; margin-bottom: 16px;">آخرین رمزها</h3>
                        <template x-for="code in recentCodes" :key="code.id">
                            <div style="display: flex; justify-content: space-between; align-items: center; background: var(--bg-color); padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border-color);">
                                <div>
                                    <p style="font-family: monospace; font-size: 18px; font-weight: 900; color: var(--primary-color);" dir="ltr" x-text="code.code"></p>
                                    <p style="font-size: 10px; color: var(--text-muted); margin-top: 4px;" x-text="code.duration_minutes + ' دقیقه | ' + (code.code_type === 'public' ? 'عمومی' : 'خصوصی')"></p>
                                </div>
                                <span :style="code.is_used ? 'background: rgba(239,68,68,0.1); color: var(--danger-color);' : 'background: rgba(16,185,129,0.1); color: var(--success-color);'" style="font-size: 10px; padding: 4px 8px; border-radius: 8px; font-weight: bold;" x-text="code.is_used ? 'استفاده شده' : 'فعال'"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <div x-show="activeTab === 'settings'" x-transition.opacity>
                    <div class="card" style="text-align: center; padding: 32px 20px;">
                        <div style="width: 80px; height: 80px; background: var(--surface-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto;">
                            <i class="fa-solid fa-user-tie" style="font-size: 32px; color: var(--primary-color);"></i>
                        </div>
                        <h3 style="font-size: 18px; font-weight: bold;">مدیر سیستم</h3>
                        <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;" x-text="currentUser?.email"></p>
                        <button @click="logout()" style="width: 100%; background: rgba(239,68,68,0.1); color: var(--danger-color); border: 1px solid rgba(239,68,68,0.2); border-radius: 16px; padding: 16px; font-weight: bold; margin-top: 32px; font-family: Vazirmatn; cursor: pointer;">
                            <i class="fa-solid fa-power-off" style="margin-left: 8px;"></i> خروج از حساب
                        </button>
                    </div>
                </div>
            </main>

            <nav class="bottom-nav">
                <button @click="activeTab = 'home'; pageTitle='داشبورد'; pageSubtitle='آمار سیستم'" :class="activeTab === 'home' ? 'active' : ''" class="nav-btn"><i class="fa-solid fa-chart-pie"></i><span>آمار</span></button>
                <button @click="activeTab = 'users'; pageTitle='کاربران'; pageSubtitle='لیست پرسنل'" :class="activeTab === 'users' ? 'active' : ''" class="nav-btn"><i class="fa-solid fa-users"></i><span>کاربران</span></button>
                <button @click="activeTab = 'codes'; pageTitle='رمزها'; pageSubtitle='مدیریت دسترسی'" :class="activeTab === 'codes' ? 'active' : ''" class="nav-btn"><i class="fa-solid fa-key"></i><span>رمزها</span></button>
                <button @click="activeTab = 'settings'; pageTitle='تنظیمات'; pageSubtitle='حساب کاربری'" :class="activeTab === 'settings' ? 'active' : ''" class="nav-btn"><i class="fa-solid fa-gear"></i><span>تنظیمات</span></button>
            </nav>
        </div>

        <template x-if="selectedUser">
            <div>
                <div @click="selectedUser = null" class="bottom-sheet-overlay"></div>
                <div class="bottom-sheet">
                    <div @click="selectedUser = null" class="sheet-handle"></div>
                    <div style="padding: 0 20px 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color);">
                        <div style="display: flex; align-items: center; gap: 16px;">
                            <div style="width: 56px; height: 56px; background: var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900;">
                                <span x-text="selectedUser.full_name?.charAt(0) || 'U'"></span>
                            </div>
                            <div>
                                <h2 style="font-size: 18px; font-weight: 900;" x-text="selectedUser.full_name"></h2>
                                <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;" x-text="selectedUser.devices?.[0]?.device_name || 'آفلاین'"></p>
                            </div>
                        </div>
                        <button @click="editName(selectedUser)" class="edit-btn" style="width: 40px; height: 40px;"><i class="fa-solid fa-pen"></i></button>
                    </div>
                    <div class="sheet-tabs">
                        <button @click="modalTab = 'apps'" :class="modalTab === 'apps' ? 'active' : ''" class="sheet-tab">اپلیکیشن‌ها</button>
                        <button @click="modalTab = 'history'" :class="modalTab === 'history' ? 'active' : ''" class="sheet-tab">تاریخچه</button>
                    </div>
                    <div style="flex: 1; overflow-y: auto; padding: 20px;">
                        <div x-show="modalTab === 'apps'">
                            <div style="background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2); color: #c7d2fe; padding: 16px; border-radius: 16px; font-size: 12px; margin-bottom: 20px; display: flex; gap: 12px; line-height: 1.6;">
                                <i class="fa-solid fa-circle-info" style="margin-top: 2px;"></i>
                                <p>کلید مقابل هر اپلیکیشن را روشن کنید تا روی گوشی کاربر قفل شود.</p>
                            </div>
                            <template x-for="app in userApps" :key="app.packageName">
                                <div style="display: flex; justify-content: space-between; align-items: center; background: var(--surface-color); padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--border-color);">
                                    <div style="display: flex; align-items: center; gap: 12px;">
                                        <div style="width: 40px; height: 40px; background: var(--surface-light); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
                                            <i class="fa-brands fa-android" style="font-size: 20px;"></i>
                                        </div>
                                        <div>
                                            <h4 style="font-size: 14px; font-weight: bold;" x-text="app.appName"></h4>
                                            <p style="font-size: 10px; color: var(--text-muted); font-family: monospace; direction: ltr; text-align: right; margin-top: 4px;" x-text="app.packageName"></p>
                                        </div>
                                    </div>
                                    <label class="switch">
                                        <input type="checkbox" :checked="isLocked(app.packageName)" @change="toggleLock(app.packageName)">
                                        <span class="slider"></span>
                                    </label>
                                </div>
                            </template>
                        </div>
                        <div x-show="modalTab === 'history'">
                            <template x-for="log in userLogs" :key="log.id">
                                <div style="display: flex; justify-content: space-between; align-items: center; background: var(--surface-color); padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--border-color);">
                                    <div style="display: flex; align-items: center; gap: 12px;">
                                        <div style="width: 36px; height: 36px; background: var(--bg-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary-color);">
                                            <i class="fa-solid fa-unlock" style="font-size: 12px;"></i>
                                        </div>
                                        <div>
                                            <p style="font-size: 14px; font-weight: bold;" x-text="log.app_name || 'دسترسی'"></p>
                                            <p style="font-size: 10px; color: var(--text-muted); margin-top: 4px;" x-text="new Date(log.started_at).toLocaleString('fa-IR')"></p>
                                        </div>
                                    </div>
                                    <span style="font-size: 12px; font-weight: bold; color: var(--success-color); background: rgba(16,185,129,0.1); padding: 4px 8px; border-radius: 8px;" dir="ltr" x-text="'+' + Math.floor((log.seconds_used || 0) / 60) + ' min'"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <script>
        const SUPABASE_URL = 'https://oxyaywwccwnpwzoysnha.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_z82X2pQcOAKLrowMxARR3w_ztloH4Te';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const Toast = Swal.mixin({ toast: true, position: 'top', showConfirmButton: false, timer: 3000, background: '#1e293b', color: '#fff', iconColor: '#6366f1' });

        function adminApp() {
            return {
                isLoggedIn: false, loginEmail: 'admin@company.com', loginPassword: '123456', currentUser: null,
                activeTab: 'home', pageTitle: 'داشبورد', pageSubtitle: 'آمار سیستم',
                employees: [], recentLogs: [], recentCodes: [], searchQuery: '',
                selectedUser: null, userApps: [], userLockedPackages: [], userLogs: [], modalTab: 'apps',
                codeType: 'public', selectedUserId: '', duration: 30, chartInstance: null,

                async init() {
                    const { data: { session } } = await db.auth.getSession();
                    if (session) { this.currentUser = session.user; this.isLoggedIn = true; this.loadData(); }
                },
                async login() {
                    Swal.fire({ title: 'در حال ورود...', background: '#1e293b', color: '#fff', didOpen: () => Swal.showLoading() });
                    const { data, error } = await db.auth.signInWithPassword({ email: this.loginEmail, password: this.loginPassword });
                    if (error) return Swal.fire({ icon: 'error', title: 'خطا', text: error.message, background: '#1e293b', color: '#fff' });
                    this.currentUser = data.user; this.isLoggedIn = true; this.loadData(); Swal.close();
                },
                async logout() { await db.auth.signOut(); window.location.reload(); },
                async loadData() {
                    const { data: emps } = await db.from('profiles').select(`id, full_name, devices(installed_apps, device_name), policies(app_packages)`).eq('role', 'employee');
                    if (emps) this.employees = emps;
                    const { data: logs } = await db.from('usage_logs').select(`*, profiles(full_name)`).order('started_at', { ascending: false }).limit(5);
                    if (logs) this.recentLogs = logs;
                    const { data: codes } = await db.from('access_codes').select('*').order('created_at', { ascending: false }).limit(5);
                    if (codes) this.recentCodes = codes;
                    this.renderChart();
                },
                async editName(user) {
                    const { value: newName } = await Swal.fire({ title: 'ویرایش نام کاربر', input: 'text', inputValue: user.full_name || '', inputPlaceholder: 'نام جدید را وارد کنید...', background: '#1e293b', color: '#fff', showCancelButton: true, confirmButtonText: 'ذخیره', cancelButtonText: 'انصراف', confirmButtonColor: '#6366f1' });
                    if (newName && newName.trim() !== '') {
                        await db.from('profiles').update({ full_name: newName.trim() }).eq('id', user.id);
                        Toast.fire({ icon: 'success', title: 'نام تغییر کرد' });
                        const idx = this.employees.findIndex(e => e.id === user.id);
                        if (idx !== -1) this.employees[idx].full_name = newName.trim();
                        if (this.selectedUser && this.selectedUser.id === user.id) this.selectedUser.full_name = newName.trim();
                    }
                },
                renderChart() {
                    const canvas = document.getElementById('usageChart'); if (!canvas) return;
                    const ctx = canvas.getContext('2d'); if (this.chartInstance) this.chartInstance.destroy();
                    this.chartInstance = new Chart(ctx, { type: 'line', data: { labels: ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'], datasets: [{ data: [120, 190, 80, 150, 200, 90, 170], borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.1)', borderWidth: 2, pointBackgroundColor: '#0b1120', pointBorderColor: '#6366f1', pointBorderWidth: 2, pointRadius: 3, tension: 0.4, fill: true }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false, beginAtZero: true }, x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { family: 'Vazirmatn', size: 10 } } } } } });
                },
                get filteredEmployees() { return this.searchQuery ? this.employees.filter(e => e.full_name && e.full_name.includes(this.searchQuery)) : this.employees; },
                get totalLockedApps() { let c = 0; this.employees.forEach(e => { if(e.policies?.[0]?.app_packages) c += e.policies[0].app_packages.length; }); return c; },
                async openUserModal(emp) {
                    this.selectedUser = emp; this.userApps = emp.devices?.[0]?.installed_apps || []; this.userLockedPackages = emp.policies?.[0]?.app_packages ? [...emp.policies[0].app_packages] : []; this.modalTab = 'apps';
                    const { data: logs } = await db.from('usage_logs').select('*').eq('user_id', emp.id).order('started_at', { ascending: false }); this.userLogs = logs || [];
                },
                isLocked(pkg) { return this.userLockedPackages.includes(pkg); },
                async toggleLock(pkg) {
                    if (this.isLocked(pkg)) this.userLockedPackages = this.userLockedPackages.filter(p => p !== pkg);
                    else this.userLockedPackages.push(pkg);
                    await db.from('policies').upsert({ user_id: this.selectedUser.id, app_packages: this.userLockedPackages, is_active: true }, { onConflict: 'user_id' });
                    const idx = this.employees.findIndex(e => e.id === this.selectedUser.id);
                    if (idx !== -1) { if (!this.employees[idx].policies) this.employees[idx].policies = [{}]; this.employees[idx].policies[0].app_packages = [...this.userLockedPackages]; }
                    Toast.fire({ icon: 'success', title: 'ذخیره شد' });
                },
                async generateCode() {
                    if (this.codeType === 'private' && !this.selectedUserId) return Toast.fire({ icon: 'warning', title: 'کاربر را انتخاب کنید' });
                    const finalCode = Math.floor(100000 + Math.random() * 900000).toString();
                    Swal.fire({ title: 'در حال ثبت...', background: '#1e293b', color: '#fff', didOpen: () => Swal.showLoading() });
                    const { error } = await db.from('access_codes').insert({ user_id: this.codeType === 'private' ? this.selectedUserId : null, code: finalCode, duration_minutes: parseInt(this.duration), code_type: this.codeType, is_used: false });
                    if (error) return Swal.fire({ icon: 'error', title: 'خطا', text: error.message, background: '#1e293b', color: '#fff' });
                    Swal.fire({ icon: 'success', title: 'رمز صادر شد', background: '#1e293b', color: '#fff', html: `<div style="text-align: center; margin-top: 16px;"><div style="font-size: 36px; font-weight: 900; letter-spacing: 4px; color: #818cf8; background: rgba(99,102,241,0.1); padding: 20px; border-radius: 16px; border: 1px solid rgba(99,102,241,0.2); margin-bottom: 16px;" dir="ltr">${finalCode}</div><p style="font-size: 14px;">مدت اعتبار: <b>${this.duration} دقیقه</b></p></div>`, confirmButtonText: 'باشه', confirmButtonColor: '#6366f1' });
                    this.loadData();
                }
            }
        }
    </script>
</body>
</html>
